name: Feature request
description: Suggest something new or a change to how the SDK works
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        If the change affects more than a few lines of code, please open this issue
        before you start working on it, so it can be discussed first.

  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - PS4
        - PS5
        - Both
        - Not console specific
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Building or installing the SDK (make)
        - Environment (setenv, PS4_PAYLOAD_SDK, PS5_PAYLOAD_SDK)
        - Compilers and toolchain files (host)
        - Startup code and kernel access (crt)
        - libc
        - SCE libraries (sce_stubs)
        - Headers (include)
        - Samples
        - Documentation
        - Other or not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case behind the request, and what is in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought of

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the open and closed issues of this repository for the same request
          required: true
