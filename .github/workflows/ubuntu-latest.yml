name: ubuntu-latest

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  pull_request:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - console: ps4
            sdk_var: PS4_PAYLOAD_SDK
          - console: ps5
            sdk_var: PS5_PAYLOAD_SDK
    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/ps-payload-sdk/downloads
        key: downloads-${{ runner.os }}-${{ hashFiles('libcxx.sh') }}

    - name: Install prerequisites
      run: |
        sudo apt update
        sudo apt install mingw-w64 cmake meson wget
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        sudo apt install llvm-23 llvm-23-dev lld-23

    - name: Set environment
      run: |
        echo "DESTDIR=${{ runner.tool_cache }}/${{ matrix.console }}-payload-sdk" >> $GITHUB_ENV
        echo "${{ matrix.sdk_var }}=${{ runner.tool_cache }}/${{ matrix.console }}-payload-sdk" >> $GITHUB_ENV
        echo "WIN=1" >> $GITHUB_ENV

    - name: Build SDK
      run: |
        make ${{ matrix.console }} install
        ./libcxx.sh ${{ matrix.console }}
        cd ${{ runner.tool_cache }}
        zip -r $GITHUB_WORKSPACE/${{ matrix.console }}-payload-sdk.zip ${{ matrix.console }}-payload-sdk
        cd -

    - name: Bundle SDK
      run: |
        cd ${{ runner.tool_cache }}
        zip -r $GITHUB_WORKSPACE/${{ matrix.console }}-payload-sdk.zip ${{ matrix.console }}-payload-sdk
        cd -

    - name: Build samples
      run: make -C samples ${{ matrix.console }}

    - name: Upload SDK
      uses: actions/upload-artifact@v4
      with:
        name: SDK-${{ matrix.console }}
        include-hidden-files: true
        path: ./${{ matrix.console }}-payload-sdk.zip
        if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write

    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SDK-*
          merge-multiple: true
          path: .

      - name: Create GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: |
            ps4-payload-sdk.zip
            ps5-payload-sdk.zip
