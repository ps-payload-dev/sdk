name: macos-latest

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - console: ps4
            sdk_var: PS4_PAYLOAD_SDK
          - console: ps5
            sdk_var: PS5_PAYLOAD_SDK
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ps-payload-sdk/downloads
          key: downloads-${{ runner.os }}-${{ hashFiles('libcxx.sh') }}

      - name: Install prerequisites
        run: |
          brew update
          brew install llvm lld meson cmake

      - name: Set environment
        run: |
          echo "DESTDIR=${{ runner.tool_cache }}/${{ matrix.console }}-payload-sdk" >> $GITHUB_ENV
          echo "${{ matrix.sdk_var }}=${{ runner.tool_cache }}/${{ matrix.console }}-payload-sdk" >> $GITHUB_ENV

      - name: Build SDK
        run: |
          make ${{ matrix.console }} install
          ./libcxx.sh ${{ matrix.console }}
        env:
          LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config

      - name: Build samples
        run: make -C samples ${{ matrix.console }}
        env:
          LLVM_CONFIG: /opt/homebrew/opt/llvm/bin/llvm-config
