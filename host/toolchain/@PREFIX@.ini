[binaries]
c = '@DIRNAME@/../bin/@PREFIX@-clang'
cpp = '@DIRNAME@/../bin/@PREFIX@-clang++'
objc = '@DIRNAME@/../bin/@PREFIX@-clang'
objcpp = '@DIRNAME@/../bin/@PREFIX@-clang++'
ld = '@DIRNAME@/../bin/@PREFIX@-@LINKER@'
ar = '@DIRNAME@/../bin/@PREFIX@-ar'
strip = '@DIRNAME@/../bin/@PREFIX@-strip'
cmake = '@DIRNAME@/../bin/@PREFIX@-cmake'
pkg-config = '@DIRNAME@/../bin/@PREFIX@-pkg-config'

[host_machine]
system = 'freebsd'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
prefix = '/user/homebrew'
default_library = 'static'

[properties]
needs_exe_wrapper = true
cmake_toolchain_file = '@DIRNAME@/@PREFIX@.cmake'
